<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Catálogo 3D · móveis em realidade aumentada</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Same showroom look as the product pages: steel ground, black type, red only for AR. */
:root{color-scheme:light dark;--bg:light-dark(#d5dbe0,#16191c);--panel:light-dark(#eef1f3,#1f2327);--ink:light-dark(#0d0f11,#f2f4f5);--muted:light-dark(#4a535b,#a9b1b8);--line:light-dark(#b7c0c7,#2e3439);--accent:#e8251a}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif}
.band{padding:clamp(24px,4vw,48px) max(5vw,16px)}
h1{font:600 clamp(32px,5vw,52px)/1.05 "Inter Tight",Inter,sans-serif;margin:0 0 8px;text-wrap:balance}
.lead{margin:0;color:var(--muted);max-width:62ch}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0 0}
.filters button{font:500 15px Inter,sans-serif;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.filters button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:16px;margin-top:22px;padding:0;list-style:none}
.card{display:flex;flex-direction:column;height:100%;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;color:inherit;text-decoration:none;transition:transform .15s,border-color .15s}
.card:hover{transform:translateY(-2px);border-color:var(--ink)}
.card img{display:block;width:100%;height:auto;aspect-ratio:1;object-fit:cover;background:light-dark(#f4f6f7,#22272b)}
.card .txt{padding:14px 16px 16px;display:flex;flex-direction:column;gap:4px;flex:1}
.card b{font:600 20px/1.2 "Inter Tight",sans-serif}
.card .dim{font-size:14px;color:var(--muted)}
.card .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:8px}
.card .tags span{font-size:12px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.card .tags .ar{border-color:var(--accent);color:var(--accent)}
.note{font-size:13px;color:var(--muted);margin:22px 0 0}
@media(prefers-reduced-motion:reduce){.card{transition:none}}
</style>
</head>
<body>
<main class="band">
  <h1>Catálogo 3D</h1>
  <p class="lead">Escolhe uma peça para a rodar em 3D. No telemóvel, dentro de cada peça, "Ver na minha sala" coloca-a no teu espaço em tamanho real.</p>
  <div class="filters" id="filters" role="group" aria-label="Filtrar por tipo"></div>
  <ul class="grid" id="grid"></ul>
  <p class="note">Modelos de demonstração. Cada página abre no browser, sem instalar aplicações.</p>
</main>
<script>
// To add a piece: one line here + its folder with index.html, .glb and .usdz + a 640×640 picture in img/.
const PECAS = [
  { id: "comoda",     nome: "Cómoda Cerejeira",            tipo: "Cómodas",  dim: "80 × 42 × 88 cm", tags: ["5 acabamentos", "Madeira"] },
  { id: "mesa-vidro", nome: "Mesa de centro vidro fumado", tipo: "Mesas",    dim: "120 × 70 × 38 cm", tags: ["Vidro", "Aço"] },
  { id: "mesa-raiz",  nome: "Mesa de centro raiz de teca", tipo: "Mesas",    dim: "Ø 90 × 45 cm",    tags: ["Vidro", "Madeira natural"] },
  { id: "poltrona",   nome: "Poltrona giratória",          tipo: "Cadeiras", dim: "78 × 90 × 99 cm", tags: ["Chenille", "Cromado"] },
  { id: "cadeira",    nome: "Cadeira de escritório",       tipo: "Cadeiras", dim: "Giratória, pele",  tags: ["Pele"] }
];
const grid = document.getElementById("grid"), filters = document.getElementById("filters");
const tipos = ["Todos", ...new Set(PECAS.map(p => p.tipo))];
const draw = (t) => {
  grid.innerHTML = PECAS.filter(p => t === "Todos" || p.tipo === t).map(p => `
    <li><a class="card" href="${p.id}/">
      <img src="img/${p.id}.jpg" alt="${p.nome}" loading="lazy" width="640" height="640">
      <span class="txt"><b>${p.nome}</b><span class="dim">${p.dim}</span>
        <span class="tags"><span class="ar">AR</span>${p.tags.map(x => `<span>${x}</span>`).join("")}</span></span>
    </a></li>`).join("");
};
tipos.forEach((t, i) => {
  const b = document.createElement("button");
  b.textContent = t; b.setAttribute("aria-pressed", String(i === 0));
  b.onclick = () => { filters.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", "false")); b.setAttribute("aria-pressed", "true"); draw(t); };
  filters.appendChild(b);
});
draw("Todos");
</script>
</body>
</html>
