<!DOCTYPE html><html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#e9ecef}model-viewer{width:900px;height:700px;background:radial-gradient(#ffffff,#d9dee2)}</style>
<script type="module" src="model-viewer.min.js"></script></head><body>
<model-viewer id="mv" camera-controls shadow-intensity="1.1" shadow-softness="0.9" exposure="1.0" environment-image="neutral" tone-mapping="neutral" interaction-prompt="none"></model-viewer>
<script>
const p=new URLSearchParams(location.search);const mv=document.getElementById('mv');
mv.src=p.get('src'); if(p.get('orbit')) mv.cameraOrbit=p.get('orbit'); if(p.get('target')) mv.cameraTarget=p.get('target'); if(p.get('fov')) mv.fieldOfView=p.get('fov');
mv.addEventListener('load',()=>{setTimeout(()=>{document.title='ready'},1500)});
mv.addEventListener('error',e=>{document.title='error'});
</script></body></html>
